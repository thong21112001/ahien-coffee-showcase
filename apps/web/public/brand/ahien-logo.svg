<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="goldCrema" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="45%" stop-color="#d97706" />
      <stop offset="85%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#451a03" />
    </radialGradient>
    <linearGradient id="heritageBrass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <radialGradient id="darkRoastBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#291e16" />
      <stop offset="75%" stop-color="#17120e" />
      <stop offset="100%" stop-color="#0c0907" />
    </radialGradient>
  </defs>

  <!-- Outer Protective Seal -->
  <circle cx="256" cy="256" r="248" fill="url(#darkRoastBg)" stroke="url(#heritageBrass)" stroke-width="8" />
  <circle cx="256" cy="256" r="230" fill="none" stroke="#d97706" stroke-width="2.5" stroke-dasharray="4 6" opacity="0.85" />
  <circle cx="256" cy="256" r="218" fill="none" stroke="url(#heritageBrass)" stroke-width="3" opacity="0.9" />

  <!-- Steam Aroma Arcs -->
  <g opacity="0.85" stroke="url(#heritageBrass)" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M 230 145 C 220 125, 235 105, 226 85" opacity="0.6" />
    <path d="M 256 140 C 248 115, 264 95, 256 75" />
    <path d="M 282 145 C 292 125, 277 105, 286 85" opacity="0.6" />
  </g>

  <!-- VIETNAMESE COFFEE PHIN (TRADITIONAL DRIPPER) -->
  <g transform="translate(0, 5)">
    <!-- Phin Lid Knob -->
    <ellipse cx="256" cy="148" rx="14" ry="7" fill="url(#goldCrema)" stroke="#fef3c7" stroke-width="1.5" />
    <rect x="252" y="152" width="8" height="6" fill="#b45309" />

    <!-- Phin Lid -->
    <path d="M 188 168 C 188 158, 220 155, 256 155 C 292 155, 324 158, 324 168 L 328 174 C 328 176, 184 176, 184 174 Z" 
          fill="url(#heritageBrass)" stroke="#fef3c7" stroke-width="1.5" />

    <!-- Phin Chamber Rim -->
    <path d="M 194 174 L 318 174 C 322 174, 322 180, 318 180 L 194 180 C 190 180, 190 174, 194 174 Z" fill="#d97706" />

    <!-- Phin Chamber Body -->
    <path d="M 196 180 L 208 262 C 209 268, 220 272, 256 272 C 292 272, 303 268, 304 262 L 316 180 Z" 
          fill="url(#darkRoastBg)" stroke="url(#heritageBrass)" stroke-width="4" />
    
    <path d="M 201 216 C 220 220, 292 220, 311 216" fill="none" stroke="#d97706" stroke-width="2.5" opacity="0.8" />
    <path d="M 204 238 C 220 242, 292 242, 308 238" fill="none" stroke="#d97706" stroke-width="2" opacity="0.6" />

    <!-- Handles -->
    <path d="M 194 192 C 176 192, 176 210, 198 214" fill="none" stroke="url(#heritageBrass)" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 318 192 C 336 192, 336 210, 314 214" fill="none" stroke="url(#heritageBrass)" stroke-width="4.5" stroke-linecap="round" />

    <!-- Base Filter Plate -->
    <path d="M 166 272 C 166 265, 210 262, 256 262 C 302 262, 346 265, 346 272 C 346 280, 302 284, 256 284 C 210 284, 166 280, 166 272 Z" 
          fill="url(#heritageBrass)" stroke="#fef3c7" stroke-width="2" />

    <!-- Glass Rim -->
    <path d="M 198 284 L 204 338 C 206 352, 224 358, 256 358 C 288 358, 306 352, 308 338 L 314 284" 
          fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6 3" opacity="0.75" />

    <!-- Coffee Drop -->
    <path d="M 256 294 C 250 304, 248 312, 256 320 C 264 312, 262 304, 256 294 Z" 
          fill="url(#goldCrema)" stroke="#fef3c7" stroke-width="1.5" />

    <!-- Coffee Surface -->
    <ellipse cx="256" cy="342" rx="42" ry="9" fill="url(#goldCrema)" opacity="0.9" />
  </g>

  <!-- Typography: A HIÈN COFFEE -->
  <path id="textArchTop" d="M 100 256 A 156 156 0 0 1 412 256" fill="none" />
  <text font-family="'Cinzel', 'Times New Roman', 'Georgia', serif" font-size="28" font-weight="900" fill="#fef3c7" letter-spacing="7">
    <textPath href="#textArchTop" startOffset="50%" text-anchor="middle">
      A HIỀN COFFEE
    </textPath>
  </text>

  <!-- Heritage Tagline: SINCE 1986 -->
  <path id="textArchBottom" d="M 400 270 A 156 156 0 0 1 112 270" fill="none" />
  <text font-family="'Be Vietnam Pro', 'Montserrat', sans-serif" font-size="16" font-weight="700" fill="#d97706" letter-spacing="5">
    <textPath href="#textArchBottom" startOffset="50%" text-anchor="middle">
      TRUYỀN THỐNG • SINCE 1986
    </textPath>
  </text>

  <!-- Lower Badge -->
  <rect x="196" y="420" width="120" height="22" rx="11" fill="#451a03" stroke="url(#heritageBrass)" stroke-width="1.5" />
  <text x="256" y="435" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif" font-size="10" font-weight="700" fill="#fef3c7" letter-spacing="2">
    ĐÀ NẴNG • VIỆT NAM
  </text>
</svg>

